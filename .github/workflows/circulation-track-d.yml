name: Circulation track D

on:
  push:
    branches:
      - circulation-par-d-forest-recursion-oct29
      - circulation-d-initial-refinement-oct29
  pull_request:
    paths:
      - 'Girth/ForestCyclicSwitching.lean'
      - 'Girth/ForestBottomSupremePullback.lean'
      - 'Girth/ForestOrderSegmentBudget.lean'
      - 'Girth/ForestSelectedMixedCoverage.lean'
      - 'Girth/ForestRecursiveInitialMixed.lean'
      - 'Girth/RootedForest.lean'
      - 'Girth/ForestToSupreme*.lean'
      - 'Girth/ForestActualRecursive*.lean'
      - 'Girth/ForestRecursive*.lean'
      - 'Girth/TrainRecursive*.lean'
      - 'Girth/TrainEdgeOnly*.lean'
      - 'CheckForestCyclicSwitching.lean'
      - 'CheckForestBottomSupremePullback.lean'
      - 'CheckForestOrderSegmentBudget.lean'
      - 'CheckForestSelectedMixedCoverage.lean'
      - 'CheckForestRecursiveInitialMixed.lean'
      - 'CheckTrackDRootedForest.lean'
      - 'CheckForestToSupreme*.lean'
      - 'CheckForestActualRecursive*.lean'
      - 'CheckForestRecursive*.lean'
      - 'CheckTrainRecursive*.lean'
      - 'CheckTrainEdgeOnly*.lean'
      - 'scripts/check_track_d.sh'
      - '.github/workflows/circulation-track-d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-d-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  track-d:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake dependencies
        uses: actions/cache@v5
        with:
          path: .lake
          key: track-d-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            track-d-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          # Retry the installer itself: it fetches the pinned Lean binary
          # after the init script has downloaded successfully.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 8 \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/lean-elan-init.sh"
          for attempt in 1 2 3 4 5; do
            if sh "$RUNNER_TEMP/lean-elan-init.sh" -y --default-toolchain none; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::pinned elan bootstrap failed after five attempts"
              exit 1
            fi
            echo "::warning::elan bootstrap attempt $attempt failed; retrying pinned toolchain"
            sleep "$((12 * attempt))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: |
          # Restored caches can retain this lock after an interrupted dependency checkout.
          # No Git process is active before this first Lake invocation.
          rm -f .lake/packages/batteries/.git/index.lock
          # Toolchain and mathlib download endpoints can intermittently return 504.
          # Retry only this acquisition step; proof compilation and axiom audits remain strict.
          for attempt in 1 2 3 4; do
            if lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup Mathlib.Combinatorics.SimpleGraph.Acyclic; then
              exit 0
            fi
            if [[ $attempt -eq 4 ]]; then
              echo "::error::Pinned Lean/mathlib acquisition failed after four attempts"
              exit 1
            fi
            echo "::warning::Pinned Lean/mathlib acquisition failed on attempt $attempt; retrying"
            sleep $((10 * attempt))
          done
      - name: Compile and audit track D
        run: |
          # Only pinned dependency caches are reused, never project objects.
          rm -rf .lake/build
          bash scripts/check_track_d.sh
