name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup
      - name: Inventory source and test audit checkers
        run: |
          python3 scripts/test_audit_circulation.py
          python3 scripts/test_check_axioms.py
          python3 scripts/audit_circulation.py --output audit-inventory.json
      - name: Build every project module from this checkout
        shell: bash
        run: |
          set -euo pipefail
          # Keep dependency caches, but never reuse unchecked project objects.
          rm -rf .lake/build
          python3 - <<'PY' > audit-build-targets.txt
          from pathlib import Path
          print('Girth')
          for source in sorted(Path('Girth').rglob('*.lean')):
              print('.'.join(source.with_suffix('').parts))
          PY
          mapfile -t modules < audit-build-targets.txt
          lake build "${modules[@]}"
      - name: Check every theorem audit exactly once
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checks=(Check*.lean)
          test "${#checks[@]}" -gt 0
          for source in "${checks[@]}"; do
            log="${source%.lean}.log"
            lake env lean "$source" | tee "$log"
            python3 scripts/check_axioms.py "$log" "$source"
          done
      - name: Run finite boundary regressions
        run: |
          python3 scripts/check_boundary_transport.py
          python3 scripts/check_boundary_girth.py
          python3 scripts/check_order_one_bridge.py
          python3 scripts/check_output_connector_layout.py
