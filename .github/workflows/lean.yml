name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup
      - name: Build two-standard obstruction modules
        run: |
          # Keep dependency caches, but never reuse unchecked project objects.
          rm -rf .lake/build
          lake build Girth.TrainOldWagonNoInsertion Girth.TrainOptionalOldSuccessor Girth.TrainOptionalOldCyclic Girth.TrainOutputA3SplitReduction Girth.TrainLiteralOldPosA3 Girth.TrainOptionalOldHeadCyclic Girth.TrainLiteralOldPosHead Girth.TrainLiteralOutputA2 Girth.TrainStrictPlanAcceptability Girth.TrainOrderOnePlanAcceptability Girth.TrainShortOnlyLiteralAcceptability Girth.TrainThreeWordCycle Girth.TrainTwoOccurrencePlanGlobal Girth.TrainOptionalKindOrder Girth.TrainOptionalKindChain Girth.TrainCyclicListOrder Girth.TrainFinCyclicOrder Girth.TrainPhysicalKindWord Girth.TrainLiteralMixedOrder Girth.TrainStrictPlanComplete Girth.TrainArbitraryLongA3 Girth.TrainArbitraryLongA2Geometry Girth.TrainArbitraryDesignatedOrigin Girth.TrainArbitraryLongOrder Girth.TrainArbitraryGeometricA2 Girth.TrainSameConnectorSupremeTransfer Girth.TrainArbitraryLiteralA2 Girth.TrainOptionalFreshnessConverse Girth.TrainFreshLocalSupreme Girth.TrainLiteralPieceLabels Girth.TrainOldPosPieceTransfer Girth.TrainFirstLongNeighbours Girth.TrainTwoStageLongComposition Girth.TrainWagonBoundaryShort Girth.TrainNoInsertionStageCompose Girth.TrainArbitrarySupremeComposition Girth.TrainArbitraryLegalReplacementComplete Girth.TrainArbitraryConnectorNodup Girth.TrainArbitraryPieceIncidence Girth.TrainArbitraryEdgeBoundaryCollision Girth.TrainArbitraryBoundaryLabels Girth.TrainArbitraryWordAssembly Girth.TrainArbitraryReplacementComplete Girth.TrainSegmentedCycleOrder Girth.TrainSelectedCycleMinimalOwners Girth.TrainSelectedCycleGeometricOwners Girth.TrainCyclicOwnerRuns Girth.TrainCyclicOwnerAbsorption Girth.TrainSelectedCycleGeometricVertex Girth.TrainSelectedCycleGeometricWagon Girth.TrainCyclicOwnerFourCases Girth.TrainSelectedCycleGeometricCutIncidence
      - name: Audit two-standard obstruction exports
        run: |
          set -euo pipefail
          for check in CheckTrainOldWagonNoInsertion CheckTrainOptionalOldSuccessor CheckTrainOptionalOldCyclic CheckTrainOutputA3SplitReduction CheckTrainLiteralOldPosA3 CheckTrainOptionalOldHeadCyclic CheckTrainLiteralOldPosHead CheckTrainLiteralOutputA2 CheckTrainStrictPlanAcceptability CheckTrainOrderOnePlanAcceptability CheckTrainShortOnlyLiteralAcceptability CheckTrainThreeWordCycle CheckTrainTwoOccurrencePlanGlobal CheckTrainOptionalKindOrder CheckTrainOptionalKindChain CheckTrainCyclicListOrder CheckTrainFinCyclicOrder CheckTrainPhysicalKindWord CheckTrainLiteralMixedOrder CheckTrainStrictPlanComplete CheckTrainArbitraryLongA3 CheckTrainArbitraryLongA2Geometry CheckTrainArbitraryDesignatedOrigin CheckTrainArbitraryLongOrder CheckTrainArbitraryGeometricA2 CheckTrainSameConnectorSupremeTransfer CheckTrainArbitraryLiteralA2 CheckTrainOptionalFreshnessConverse CheckTrainFreshLocalSupreme CheckTrainLiteralPieceLabels CheckTrainOldPosPieceTransfer CheckTrainFirstLongNeighbours CheckTrainTwoStageLongComposition CheckTrainWagonBoundaryShort CheckTrainNoInsertionStageCompose CheckTrainArbitrarySupremeComposition CheckTrainArbitraryLegalReplacementComplete CheckTrainArbitraryConnectorNodup CheckTrainArbitraryPieceIncidence CheckTrainArbitraryEdgeBoundaryCollision CheckTrainArbitraryBoundaryLabels CheckTrainArbitraryWordAssembly CheckTrainArbitraryReplacementComplete CheckTrainSegmentedCycleOrder CheckTrainSelectedCycleMinimalOwners CheckTrainSelectedCycleGeometricOwners CheckTrainCyclicOwnerRuns CheckTrainCyclicOwnerAbsorption CheckTrainSelectedCycleGeometricVertex CheckTrainSelectedCycleGeometricWagon CheckTrainCyclicOwnerFourCases CheckTrainSelectedCycleGeometricCutIncidence; do
            lake env lean "${check}.lean" | tee "${check}.log"
            python3 scripts/check_axioms.py "${check}.log" "${check}.lean"
          done
      - name: Build all project modules
        run: |
          # Objects above were built from this checkout; no unchecked project cache remains.
          lake build Girth.TrainActualTwoStandardDesignatedBlock
          lake build Girth.TrainSelectedPictureContainedBlocks Girth.TrainShortReplacementGlobal Girth.TrainSingleShortReplacement Girth.TrainShortReplacementNeighbour Girth.TrainShortOnlyPlanGlobal Girth.TrainFreshLongWagon Girth.TrainLongBoundaryCollision Girth.TrainFreshWagonA2 Girth.TrainRetainedEdgeBoundary Girth.TrainCheckedCycleWord Girth.TrainInsertedConnectorNodup Girth.TrainExpandedWordChain Girth.TrainPlanBlockChain Girth.TrainPlanGlobalAssembly Girth.TrainPlanCyclicWrap Girth.TrainOutputA1Length Girth.TrainComposeLongBridges Girth.TrainSupremeLabelProvenance Girth.TrainTwoOccurrenceMixedLong Girth.TrainAllLengthPlanGlobal Girth.TrainThreeWagonCycleAcceptability Girth.TrainTwoLongOutputAccept Girth.TrainTwoPlanOutputAccept Girth.TrainA3ContactTransfer Girth.TrainA2ContactTransfer Girth.TrainOutputOldPos Girth.TrainOutputWagonOrigin Girth.TrainOptionalFreshSuccessor Girth.TrainOptionalFreshCyclic Girth.TrainOldWagonNoInsertion Girth.TrainOptionalOldSuccessor Girth.TrainOptionalOldCyclic Girth.TrainOutputA3SplitReduction Girth.TrainLiteralOldPosA3 Girth.TrainOptionalOldHeadCyclic Girth.TrainLiteralOldPosHead Girth.TrainLiteralOutputA2 Girth.TrainStrictPlanAcceptability Girth.TrainOrderOnePlanAcceptability Girth.TrainShortOnlyLiteralAcceptability Girth.TrainThreeWordCycle Girth.TrainTwoOccurrencePlanGlobal Girth.TrainOptionalKindOrder Girth.TrainOptionalKindChain Girth.TrainCyclicListOrder Girth.TrainFinCyclicOrder Girth.TrainPhysicalKindWord Girth.TrainLiteralMixedOrder Girth.TrainStrictPlanComplete Girth.TrainArbitraryLongA3 Girth.TrainArbitraryLongA2Geometry Girth.TrainArbitraryDesignatedOrigin Girth.TrainArbitraryLongOrder Girth.TrainArbitraryGeometricA2 Girth.TrainSameConnectorSupremeTransfer Girth.TrainArbitraryLiteralA2 Girth.TrainOptionalFreshnessConverse Girth.TrainFreshLocalSupreme Girth.TrainLiteralPieceLabels Girth.TrainOldPosPieceTransfer Girth.TrainFirstLongNeighbours Girth.TrainTwoStageLongComposition Girth.TrainWagonBoundaryShort Girth.TrainNoInsertionStageCompose Girth.TrainArbitrarySupremeComposition Girth.TrainArbitraryLegalReplacementComplete Girth.TrainArbitraryConnectorNodup Girth.TrainArbitraryPieceIncidence Girth.TrainArbitraryEdgeBoundaryCollision Girth.TrainArbitraryBoundaryLabels Girth.TrainArbitraryWordAssembly Girth.TrainArbitraryReplacementComplete Girth.TrainSegmentedCycleOrder Girth.TrainSelectedCycleMinimalOwners Girth.TrainSelectedCycleGeometricOwners Girth.TrainCyclicOwnerRuns Girth.TrainCyclicOwnerAbsorption Girth.TrainSelectedCycleGeometricVertex Girth.TrainSelectedCycleGeometricWagon Girth.TrainCyclicOwnerFourCases Girth.TrainSelectedCycleGeometricCutIncidence
          lake build Girth.TrainStandardPictureFourWagonBoundary
          # Preserve the explicit circulation targets, including non-root imports.
          lake build Girth.TrainBigCycleOrderOneExtraction Girth.TrainBigCycleTwoWagonObstruction Girth.TrainLengthTwoBridgeLemma Girth.TrainBigCycleOrderBudget Girth.TrainSimultaneousSupreme Girth.TrainBoundaryPairCoreSupport Girth.TrainBoundaryPairSharedOldACopy Girth.TrainPhysicalAEdgeCoreBoundary Girth.TrainSupremeVertexCoverage Girth.TrainFourOccurrenceWagonCycle Girth.TrainFullSystemGirthParameter Girth.TrainAllAdjacentParameterPreservation Girth.TrainAllAdjacentParametersBridge Girth.TrainWagonStrongInduced Girth.TrainWagonPairUniqueness Girth.TrainWagonThreeLink Girth.TrainActualWagonThreeLink Girth.TrainActualTwoStandardEdgeBlock Girth.TrainActualTwoStandardEdgeBlockObstruction Girth.TrainTwoCopyCommonWagon Girth.TrainReplacementOrder Girth.TrainTwoCopyVertexProbe Girth.TrainShortReplacementAcceptability Girth.TrainFillingCarrierInvariant Girth.TrainTwoCopyLongProbe Girth.TrainTwoCopyLocalSymmetry Girth.TrainTwoCopyGlobalFirst Girth.TrainTwoCopyGlobalSecond Girth.TrainTwoCopyIndexedSymmetry Girth.TrainOrderOneGlobalBridge
          lake build
          lake build Girth.TrainPhysicalWagonQuotientModel Girth.TrainActualInteriorParentQuotientBridge Girth.TrainTaggedQuotientCarrier
          lake build Girth.TrainCrossStandardCoreWagon
          lake build Girth.TrainCrossStandardCoreIncidence
          lake build Girth.TrainActualStandardCoreIncidence
          lake build Girth.TrainSharedSupportInteriorCompatibility Girth.TrainBigCyclePhysicalIncidence Girth.TrainSelectedCycleBoundaryIncidence Girth.TrainSelectedCycleVertexCoreBoundary Girth.TrainSelectedCycleStandardCoreWagon Girth.TrainSelectedCycleTwoStandardVertex Girth.TrainSelectedCycleCoreCoreVertex Girth.TrainSelectedCycleTwoStandardWagon Girth.TrainSelectedPictureOutputLabelCover Girth.TrainSelectedPictureCanonicalEdgeSource Girth.TrainMinimalCyclicOwners
          lake build Girth.TrainPhysicalParameterBridgeComposite
          lake build Girth.TrainActualWagonCarrierGeometry Girth.TrainActualPhysicalParameterComposite
          lake build Girth.TrainActualPhysicalEdgeCarrierEval Girth.TrainActualSupportParameterTransport
          lake build Girth.TrainUniversalTopOrderOne
      - name: Check theorem axioms
        run: |
          set -euo pipefail
          # Preserve every previous audit; keep additions in one explicit list.
          checks=(
            CheckAxioms CheckSuccessorBoundary CheckWagonQuotients CheckTaggedQuotients
            CheckTrainCrossStandardCoreWagon
            CheckTrainCrossStandardCoreIncidence
            CheckTrainActualStandardCoreIncidence
            CheckTrainSharedSupportInteriorCompatibility CheckTrainBigCyclePhysicalIncidence
            CheckTrainSelectedCycleBoundaryIncidence CheckTrainSelectedCycleVertexCoreBoundary CheckTrainSelectedCycleStandardCoreWagon CheckTrainSelectedCycleTwoStandardVertex CheckTrainSelectedCycleCoreCoreVertex CheckTrainSelectedCycleTwoStandardWagon CheckTrainSelectedPictureOutputLabelCover CheckTrainSelectedPictureCanonicalEdgeSource CheckTrainMinimalCyclicOwners
            CheckPhysicalParameterComposite CheckActualPhysicalParameter CheckActualSupportTransport
            CheckUniversalTopOrderOne CheckTrainBigCycleOrderOne CheckTrainBigCycleTwoWagon
            CheckTrainLengthTwoBridgeLemma CheckTrainBigCycleOrderBudget CheckTrainSimultaneousSupreme
            CheckTrainBoundaryPairCoreSupport CheckTrainBoundaryPairSharedOldACopy
            CheckTrainPhysicalAEdgeCoreBoundary CheckTrainSupremeVertexCoverage
            CheckTrainFourOccurrenceWagonCycle CheckTrainFourWagonFrameBuilder
            CheckTrainStandardPictureSystemGirth CheckTrainStandardPictureFourWagonBoundary
            CheckTrainActualTwoStandardDesignatedBlock CheckTrainSelectedPictureTwoStandard
            CheckTrainSelectedPictureOutputIncidence CheckTrainSelectedPictureContainedBlocks CheckTrainShortReplacementGlobal CheckTrainSingleShortReplacement CheckTrainShortReplacementNeighbour CheckTrainShortOnlyPlanGlobal CheckTrainFreshLongWagon CheckTrainLongBoundaryCollision CheckTrainFreshWagonA2 CheckTrainRetainedEdgeBoundary CheckTrainCheckedCycleWord CheckTrainInsertedConnectorNodup CheckTrainExpandedWordChain CheckTrainPlanBlockChain CheckTrainPlanGlobalAssembly CheckTrainPlanCyclicWrap CheckTrainOutputA1Length CheckTrainComposeLongBridges CheckTrainSupremeLabelProvenance CheckTrainTwoOccurrenceMixedLong CheckTrainAllLengthPlanGlobal CheckTrainThreeWagonCycleAcceptability CheckTrainTwoLongOutputAccept CheckTrainTwoPlanOutputAccept CheckTrainA3ContactTransfer CheckTrainA2ContactTransfer CheckTrainOutputOldPos CheckTrainOutputWagonOrigin CheckTrainOptionalFreshSuccessor CheckTrainOptionalFreshCyclic CheckTrainOldWagonNoInsertion CheckTrainOptionalOldSuccessor CheckTrainOptionalOldCyclic CheckTrainOutputA3SplitReduction CheckTrainLiteralOldPosA3 CheckTrainOptionalOldHeadCyclic CheckTrainLiteralOldPosHead CheckTrainLiteralOutputA2 CheckTrainStrictPlanAcceptability CheckTrainOrderOnePlanAcceptability CheckTrainShortOnlyLiteralAcceptability CheckTrainThreeWordCycle CheckTrainTwoOccurrencePlanGlobal CheckTrainOptionalKindOrder CheckTrainOptionalKindChain CheckTrainCyclicListOrder CheckTrainFinCyclicOrder CheckTrainPhysicalKindWord CheckTrainLiteralMixedOrder CheckTrainStrictPlanComplete CheckTrainArbitraryLongA3 CheckTrainArbitraryLongA2Geometry CheckTrainArbitraryDesignatedOrigin CheckTrainArbitraryLongOrder CheckTrainArbitraryGeometricA2 CheckTrainSameConnectorSupremeTransfer CheckTrainArbitraryLiteralA2 CheckTrainOptionalFreshnessConverse CheckTrainFreshLocalSupreme CheckTrainLiteralPieceLabels CheckTrainOldPosPieceTransfer CheckTrainFirstLongNeighbours CheckTrainTwoStageLongComposition CheckTrainWagonBoundaryShort CheckTrainNoInsertionStageCompose CheckTrainArbitrarySupremeComposition CheckTrainArbitraryLegalReplacementComplete CheckTrainArbitraryConnectorNodup CheckTrainArbitraryPieceIncidence CheckTrainArbitraryEdgeBoundaryCollision CheckTrainArbitraryBoundaryLabels CheckTrainArbitraryWordAssembly CheckTrainArbitraryReplacementComplete CheckTrainSegmentedCycleOrder CheckTrainSelectedCycleMinimalOwners CheckTrainSelectedCycleGeometricOwners CheckTrainCyclicOwnerRuns CheckTrainCyclicOwnerAbsorption CheckTrainSelectedCycleGeometricVertex CheckTrainSelectedCycleGeometricWagon CheckTrainCyclicOwnerFourCases CheckTrainSelectedCycleGeometricCutIncidence
            CheckTrainFullSystemParameter CheckTrainAllAdjacentParameters
            CheckTrainAllAdjacentParametersBridge CheckTrainWagonStrongInduced
            CheckTrainWagonPairUniqueness CheckTrainWagonThreeLink CheckTrainActualWagonThreeLink
            CheckTrainActualTwoStandardEdgeBlock CheckTrainActualTwoStandardEdgeBlockObstruction
            CheckTrainTwoCopyCommonWagon CheckTrainReplacementOrder CheckTrainTwoCopyVertexProbe
            CheckTrainShortReplacement CheckTrainFillingCarrierInvariant CheckTrainTwoCopyLongProbe
            CheckTrainTwoCopyLocalSymmetry CheckTrainTwoCopyGlobalFirst CheckTrainTwoCopyGlobalSecond
            CheckTrainTwoCopyIndexedSymmetry CheckTrainOrderOneGlobalBridge
          )
          for check in "${checks[@]}"; do
            lake env lean "${check}.lean" | tee "${check}.log"
            python3 scripts/check_axioms.py "${check}.log" "${check}.lean"
          done
      - name: Run finite boundary regressions
        run: |
          python3 scripts/check_boundary_transport.py
          python3 scripts/check_boundary_girth.py
          python3 scripts/check_order_one_bridge.py
          python3 scripts/check_output_connector_layout.py
