      - name: Upload lake segment 04
        uses: actions/upload-artifact@v4
        with:
          name: girth-lake-04-linux
          path: agent-bundle/lake.tar.zst.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload lake segment 05
        uses: actions/upload-artifact@v4
        with:
          name: girth-lake-05-linux
          path: agent-bundle/lake.tar.zst.part-05
