name: Temporary lean-girth offline Linux workspace

on:
  push:
    branches:
      - agent/lean-girth-offline-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: girth-local-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            lean-toolchain-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache pinned Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan with download retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none; then
              break
            fi
            if [[ $attempt == 4 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download exact pinned mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          rm -f .lake/packages/batteries/.git/index.lock
          for attempt in 1 2 3 4; do
            if lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup; then
              exit 0
            fi
            if [[ $attempt == 4 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Check compiler and exact package graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.35.0-rc3'
          lean --version
          lake --version
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('lake-manifest.json').read_text())
          packages={x['name']:x for x in manifest['packages']}
          assert packages['mathlib']['rev']=='5bd58ac291422a21f412ae354c91e7d172255a2c'
          pins={
            'partite-construction':'d2394f65861528f27d68c4a42042285dafef301d',
            'successor-tree-lean':'f9513be1d92782e7a8c45916d32e6e11dc0e0dcf'
          }
          for folder,pin in pins.items():
              path=Path('.lake/packages')/folder
              actual=subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()
              assert actual==pin, f'{folder}: {actual} != {pin}'
          print('Verified exact mathlib and checked-out partite/successor Git revisions')
          PY
      - name: Compile Track A and check kernel axioms
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p agent-bundle
          lake build Girth.TrainActualOneLevelGirthIntrinsic 2>&1 | tee agent-bundle/track-a-build.log
          build_rc=${PIPESTATUS[0]}
          echo "$build_rc" > agent-bundle/TRACK_A_BUILD_STATUS
          if [[ "$build_rc" != 0 ]]; then exit "$build_rc"; fi
          lake env lean CheckActualOneLevelGirthIntrinsic.lean 2>&1 | tee agent-bundle/track-a-axioms.log
          check_rc=${PIPESTATUS[0]}
          if [[ "$check_rc" != 0 ]]; then exit "$check_rc"; fi
          python3 scripts/check_axioms.py agent-bundle/track-a-axioms.log CheckActualOneLevelGirthIntrinsic.lean
      - name: Create pinned source, Linux compiler and Lake archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-bundle/source-files
          git rev-parse HEAD > agent-bundle/SOURCE_SHA
          git archive HEAD | tar -xf - -C agent-bundle/source-files
          cp lake-manifest.json agent-bundle/source-files/lake-manifest.json
          cp lean-toolchain lakefile.toml lake-manifest.json agent-bundle/
          tar -C agent-bundle/source-files -cf - . | zstd -T2 -3 -o agent-bundle/source.tar.zst
          (cd agent-bundle && sha256sum source.tar.zst > SOURCE_SHA256SUMS)
          # Transport an actual official Linux release; never ship macOS native binaries.
          for attempt in 1 2 3 4; do
            if curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
              -o agent-bundle/lean-4.35.0-rc3-linux.tar.zst \
              https://github.com/leanprover/lean4/releases/download/v4.35.0-rc3/lean-4.35.0-rc3-linux.tar.zst; then
              break
            fi
            if [[ $attempt == 4 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          echo '1526de16c0496f16b46a168f26c990af4e3796505273c3342fec17d72d763997  agent-bundle/lean-4.35.0-rc3-linux.tar.zst' | sha256sum -c -
          (cd agent-bundle && sha256sum lean-4.35.0-rc3-linux.tar.zst > LEAN_SHA256SUMS)
          split -b 300000000 -d -a 2 agent-bundle/lean-4.35.0-rc3-linux.tar.zst agent-bundle/lean.tar.zst.part-
          (cd agent-bundle && sha256sum lean.tar.zst.part-* > LEAN_PART_SHA256SUMS)
          rm agent-bundle/lean-4.35.0-rc3-linux.tar.zst
          tar -cf - .lake | zstd -T2 -3 -o agent-bundle/lake.tar.zst
          (cd agent-bundle && sha256sum lake.tar.zst > LAKE_SHA256SUMS)
          split -b 300000000 -d -a 2 agent-bundle/lake.tar.zst agent-bundle/lake.tar.zst.part-
          (cd agent-bundle && sha256sum lake.tar.zst.part-* > LAKE_PART_SHA256SUMS)
          rm agent-bundle/lake.tar.zst
          bash tools/restore_local_lean_girth.sh --verify-only agent-bundle "$RUNNER_TEMP/girth-verification-only"
          rm -rf agent-bundle/source-files
      - name: Upload manifest and source
        uses: actions/upload-artifact@v4
        with:
          name: girth-source-linux
          path: |
            agent-bundle/source.tar.zst
            agent-bundle/SOURCE_SHA
            agent-bundle/lean-toolchain
            agent-bundle/lakefile.toml
            agent-bundle/lake-manifest.json
            agent-bundle/SOURCE_SHA256SUMS
            agent-bundle/LEAN_SHA256SUMS
            agent-bundle/LEAN_PART_SHA256SUMS
            agent-bundle/LAKE_SHA256SUMS
            agent-bundle/LAKE_PART_SHA256SUMS
            agent-bundle/track-a-build.log
            agent-bundle/track-a-axioms.log
            agent-bundle/TRACK_A_BUILD_STATUS
          compression-level: 0
          retention-days: 3

      - name: Upload lean segment 00
        uses: actions/upload-artifact@v4
        with:
          name: girth-lean-00-linux
          path: agent-bundle/lean.tar.zst.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload lean segment 01
        uses: actions/upload-artifact@v4
        with:
          name: girth-lean-01-linux
          path: agent-bundle/lean.tar.zst.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload lean segment 02
        uses: actions/upload-artifact@v4
        with:
          name: girth-lean-02-linux
          path: agent-bundle/lean.tar.zst.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload lake segment 00
        uses: actions/upload-artifact@v4
        with:
          name: girth-lake-00-linux
          path: agent-bundle/lake.tar.zst.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload lake segment 01
        uses: actions/upload-artifact@v4
        with:
          name: girth-lake-01-linux
          path: agent-bundle/lake.tar.zst.part-01
          if-no-files-found: ignore
          compression-level: 0
