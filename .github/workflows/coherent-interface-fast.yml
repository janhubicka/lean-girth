name: Coherent-interface focused Lean

on:
  pull_request:
    paths:
      - ".github/workflows/coherent-interface-fast.yml"
      - "Girth/Coherent*.lean"
      - "Girth/TypedInterfaceForest.lean"
      - "Girth/Port*.lean"
      - "Girth/ClosedPort*.lean"
      - "Girth/CrossPort*.lean"
      - "Girth/FreePort*.lean"
      - "Girth/SupportedPartialClosure*.lean"
      - "Girth/Canonical*.lean"
      - "Girth/PersistentProfileColouring.lean"
      - "CheckCoherentInterface.lean"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean toolchain
        uses: actions/cache@v5
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake workspace
        uses: actions/cache@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          # Retry the exact pinned Lean bootstrap on transient 5xx errors.
          # A proof/build failure is never retried or hidden.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 8             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             -o "$RUNNER_TEMP/lean-elan-init.sh"
          for attempt in 1 2 3 4 5; do
            if sh "$RUNNER_TEMP/lean-elan-init.sh" -y --default-toolchain none; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::elan bootstrap failed after 5 attempts"
              exit 1
            fi
            sleep "$((attempt * 12))"
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          # Restored caches can retain this lock after an interrupted dependency checkout.
          # No Git process is active before this first Lake invocation.
          for attempt in 1 2 3 4 5; do
            rm -f .lake/packages/batteries/.git/index.lock
            if lake exe cache get Mathlib.Tactic Mathlib.Data.Fintype.Pi Mathlib.Data.Fintype.Basic Mathlib.Data.Finset.Dedup; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::pinned Mathlib cache retrieval failed after 5 attempts"
              exit 1
            fi
            sleep "$((attempt * 12))"
          done
      - name: Verify axiom parser regression
        run: python3 scripts/test_check_axioms.py
      - name: Compile all research roots (incrementally)
        shell: bash
        run: |
          set -euo pipefail
          lake build Girth.CoherentSharedTreeExact Girth.CanonicalOccurrenceBirth Girth.PersistentProfileColouring Girth.ClosedPortShortCycles Girth.PortAttachmentUnique Girth.FreePortClosureCriterion
      - name: Strict axioms audit for coherent-port research
        shell: bash
        run: |
          set -euo pipefail
          lake env lean CheckCoherentInterface.lean | tee CheckCoherentInterface.log
          python3 scripts/check_axioms.py CheckCoherentInterface.log CheckCoherentInterface.lean
